plugins { id 'com.android.application' }
def cfg = { String key ->
    (System.getenv(key) ?: "").replace('\\','\\\\').replace('"','\\"')
}
android {
    namespace 'com.rav.alliance'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.rav.alliance'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String','RAV_FIREBASE_PROJECT_ID','"'+cfg('RAV_FIREBASE_PROJECT_ID')+'"'
        buildConfigField 'String','RAV_FIREBASE_APP_ID','"'+cfg('RAV_FIREBASE_APP_ID')+'"'
        buildConfigField 'String','RAV_FIREBASE_API_KEY','"'+cfg('RAV_FIREBASE_API_KEY')+'"'
        buildConfigField 'String','RAV_FIREBASE_SENDER_ID','"'+cfg('RAV_FIREBASE_SENDER_ID')+'"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.firebase:firebase-messaging:26.0.2'
}
