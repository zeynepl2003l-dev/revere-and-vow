name: RAV Android APK (test)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform (runner already has command-line tools)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found in installed Android tools"; exit 1; fi
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        env:
          RAV_FIREBASE_PROJECT_ID: ${{ vars.RAV_FIREBASE_PROJECT_ID }}
          RAV_FIREBASE_APP_ID: ${{ vars.RAV_FIREBASE_APP_ID }}
          RAV_FIREBASE_API_KEY: ${{ vars.RAV_FIREBASE_API_KEY }}
          RAV_FIREBASE_SENDER_ID: ${{ vars.RAV_FIREBASE_SENDER_ID }}
        run: gradle --no-daemon --max-workers=2 -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RAV-Alliance-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android beta APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk RAV-Alliance-Android-Beta.apk
          if gh release view android-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-beta RAV-Alliance-Android-Beta.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-beta RAV-Alliance-Android-Beta.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RAV Alliance Android Beta (test)" \
              --notes "RAV Alliance Android test APK. Debug build for limited testing only; not a production release." \
              --prerelease
          fi
